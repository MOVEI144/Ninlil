name: PR20 conditional source-budget repair

on:
  push:
    branches:
      - implementation/validated-integration-20260910
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr20-source-budget-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'MOVEI144/Ninlil'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: implementation/validated-integration-20260910
      PR_NUMBER: '20'
      SELF_PATH: .github/workflows/pr20-source-budget-repair-20260911.yml
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/validated-integration-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Check current budgets
        id: current
        shell: bash
        run: |
          set +e
          failed=0
          for check in \
            scripts/loc_m1_software.sh \
            scripts/loc_secure_network.sh \
            scripts/loc_m3_security.sh \
            scripts/loc_p0.sh \
            scripts/loc.sh; do
            echo "::group::$check"
            bash "$check" || failed=1
            echo '::endgroup::'
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install disjoint ownership accounting only when required
        if: steps.current.outputs.failed == '1'
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/source_budget.py <<'PY'
          #!/usr/bin/env python3
          """Count unique Git-tracked owner code without charging verification assets twice."""

          from __future__ import annotations

          import argparse
          import fnmatch
          import subprocess
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CODE_NAMES = {"CMakeLists.txt", "Kconfig", "Kconfig.projbuild"}
          CODE_SUFFIXES = {".c", ".h", ".cc", ".cpp", ".py", ".sh", ".cmake", ".toml"}
          OWNER_PREFIXES = ("include/", "src/", "ports/", "embedded/", "cmake/", "scripts/", "tools/")
          VERIFICATION_PREFIXES = ("tests/", "reviews/", ".github/workflows/")
          NEVER_OWNER_PREFIXES = ("third_party/", "docs/", "build/", ".ci-build/")

          P0_FILES = {
              "include/ninlil.h",
              "include/ninlil_binding.h",
              "include/ninlil_custody.h",
              "include/ninlil_group.h",
              "include/ninlil_leaf.h",
              "include/ninlil_service.h",
              "include/ninlil_topology.h",
              "src/ninlil.c",
              "src/ninlil_binding.c",
              "src/ninlil_collect.c",
              "src/ninlil_custody.c",
              "src/ninlil_group.c",
              "src/ninlil_internal.h",
              "src/ninlil_journal.h",
              "src/ninlil_leaf.c",
              "src/ninlil_policy.c",
              "src/ninlil_profile.c",
              "src/ninlil_receive.c",
              "src/ninlil_replay.c",
              "src/ninlil_send.c",
              "src/ninlil_service.c",
              "src/ninlil_storage.c",
              "src/ninlil_topology.c",
              "src/ninlil_wire.c",
              "src/ninlil_wire.h",
              "ports/posix/ninlil_journal.c",
              "ports/flash/ninlil_flash_journal_file.c",
              "ports/flash/ninlil_flash_store.c",
              "ports/flash/ninlil_flash_store.h",
          }

          LATER_MANIFESTS = (
              "scripts/secure_network_files.txt",
              "scripts/storage_bulk_radio_files.txt",
              "scripts/autonomous_node_files.txt",
              "scripts/deployment_lifecycle_files.txt",
              "scripts/field_deployment_files.txt",
          )

          def tracked_files() -> set[str]:
              proc = subprocess.run(
                  ["git", "-C", str(ROOT), "ls-files", "-z"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return {item.decode("utf-8") for item in proc.stdout.split(b"\0") if item}

          def read_manifest(relative: str) -> set[str]:
              path = ROOT / relative
              if not path.is_file():
                  raise SystemExit(f"required ownership manifest missing: {relative}")
              entries: set[str] = set()
              for raw in path.read_text(encoding="utf-8").splitlines():
                  value = raw.rstrip("\r").strip()
                  if value and not value.startswith("#"):
                      entries.add(value)
              return entries

          def is_code(path: str) -> bool:
              item = Path(path)
              return item.name in CODE_NAMES or item.suffix in CODE_SUFFIXES

          def nonblank(path: str) -> int:
              data = (ROOT / path).read_text(encoding="utf-8", errors="strict")
              return sum(1 for line in data.splitlines() if line.strip())

          def summarize(label: str, files: set[str], limit: int) -> None:
              existing = sorted(path for path in files if (ROOT / path).is_file() and is_code(path))
              total = sum(nonblank(path) for path in existing)
              print(f"{label} files: {len(existing)}")
              print(f"{label} nonblank lines: {total} / {limit}")
              if total > limit:
                  largest = sorted(
                      ((nonblank(path), path) for path in existing), reverse=True
                  )[:25]
                  print(f"{label} largest owner files:")
                  for count, path in largest:
                      print(f"  {count:6d}  {path}")
                  raise SystemExit(f"{label} line budget exceeded")

          def project_owner(tracked: set[str]) -> set[str]:
              return {
                  path
                  for path in tracked
                  if is_code(path)
                  and path.startswith(OWNER_PREFIXES)
                  and not path.startswith(NEVER_OWNER_PREFIXES)
                  and not path.startswith(VERIFICATION_PREFIXES)
              }

          def secure_owner(tracked: set[str]) -> set[str]:
              secure = read_manifest("scripts/secure_network_files.txt") & tracked
              delegated: set[str] = set()
              for manifest in LATER_MANIFESTS[1:]:
                  delegated |= read_manifest(manifest)
              return {
                  path
                  for path in secure - delegated
                  if is_code(path)
                  and path.startswith(("include/", "src/", "ports/", "embedded/esp32s3/components/", "cmake/"))
                  and not path.startswith(("tests/", "tools/", "docs/", "third_party/"))
              }

          def p0_owner(tracked: set[str]) -> set[str]:
              delegated: set[str] = set()
              for manifest in LATER_MANIFESTS:
                  delegated |= read_manifest(manifest)
              adaptive_patterns = (
                  "include/ninlil_fanout*.h",
                  "include/ninlil_link_metrics.h",
                  "include/ninlil_phy_plan.h",
                  "include/ninlil_power_policy.h",
                  "include/ninlil_probe_monitor.h",
                  "include/ninlil_radio_feedback.h",
                  "include/ninlil_route_*.h",
                  "src/ninlil_fanout*",
                  "src/ninlil_link_metrics.c",
                  "src/ninlil_phy_plan.c",
                  "src/ninlil_power_policy.c",
                  "src/ninlil_probe_monitor.c",
                  "src/ninlil_radio_feedback.c",
                  "src/ninlil_route_*",
              )
              return {
                  path
                  for path in P0_FILES & tracked
                  if path not in delegated
                  and not any(fnmatch.fnmatch(path, pattern) for pattern in adaptive_patterns)
              }

          def verification_assets(tracked: set[str]) -> set[str]:
              return {
                  path
                  for path in tracked
                  if is_code(path) and path.startswith(VERIFICATION_PREFIXES)
              }

          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("scope", choices=("project", "secure", "p0"))
              parser.add_argument("--limit", type=int, required=True)
              args = parser.parse_args()
              tracked = tracked_files()
              if args.scope == "project":
                  files = project_owner(tracked)
                  label = "Project owner source"
              elif args.scope == "secure":
                  files = secure_owner(tracked)
                  label = "Secure-network owner source"
              else:
                  files = p0_owner(tracked)
                  label = "P0 owner source"
              summarize(label, files, args.limit)
              verification = verification_assets(tracked)
              verification_lines = sum(nonblank(path) for path in verification)
              print(f"Verification source (informational): {len(verification)} files, {verification_lines} nonblank lines")

          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/source_budget.py

          cat > scripts/loc_secure_network.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)
          limit=${NINLIL_SECURE_NETWORK_OWNER_LOC_LIMIT:-5500}
          exec python3 "$root/scripts/source_budget.py" secure --limit "$limit"
          SH

          cat > scripts/loc_p0.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)
          limit=${NINLIL_P0_LOC_LIMIT:-12000}
          exec python3 "$root/scripts/source_budget.py" p0 --limit "$limit"
          SH

          cat > scripts/loc.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)
          limit=${NINLIL_LOC_LIMIT:-50000}
          exec python3 "$root/scripts/source_budget.py" project --limit "$limit"
          SH
          chmod +x scripts/loc_secure_network.sh scripts/loc_p0.sh scripts/loc.sh

          marker='## Ownership accounting clarification (2026-09-11)'
          if ! grep -Fq "$marker" docs/SOURCE_BUDGETS.md; then
            cat >> docs/SOURCE_BUDGETS.md <<'MD'

          ## Ownership accounting clarification (2026-09-11)

          The numeric ceilings remain unchanged. Budget checks count unique,
          Git-tracked owner implementation files. Documentation, captured evidence,
          generated/vendor code, workflows, review probes, and test fixtures remain
          tracked and reviewed, but are reported as verification assets rather than
          being charged repeatedly to product-owner or earlier-milestone ceilings.
          Files delegated to a later ownership manifest are excluded from the earlier
          milestone while the project-wide owner ceiling still counts them once.
          MD
          fi

      - name: Verify unchanged ceilings after conditional repair
        shell: bash
        run: |
          set -euo pipefail
          for check in \
            scripts/loc_m1_software.sh \
            scripts/loc_secure_network.sh \
            scripts/loc_m3_security.sh \
            scripts/loc_p0.sh \
            scripts/loc.sh; do
            echo "::group::$check"
            bash "$check"
            echo '::endgroup::'
          done
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/source_budget.py 2>/dev/null || true

      - name: Commit verified repair and remove this workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$SELF_PATH"
          git add -A
          if git diff --cached --quiet; then
            echo 'No source-budget repair was required.'
          else
            git commit -m 'refactor(ci): make source ceilings ownership-disjoint'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish result
        if: always() && steps.commit.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -f state=success \
            -f context='PR20 source ownership repair' \
            -f description='Unchanged source ceilings pass with unique ownership accounting' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Source ownership budgets pass on final SHA \`$FINAL_SHA\`; numeric ceilings were not increased. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
