name: Recover verified source
on:
  push:
    branches: [implementation/validated-integration-20260910]
    paths: [.github/workflows/recover-verified-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ninlil-recover-verified-source
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install native build and decompression tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zstd
      - name: Verify source dictionary, compressed recipe, and every source change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = implementation/validated-integration-20260910
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          def checked(data, digest):
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit('SHA-256 mismatch: ' + actual + ' expected ' + digest)
              return data
          base = '02687d688c2c4279fbf49afd0467b8c0533601ad'
          names = subprocess.check_output(['git', 'ls-tree', '-rz', '--name-only', base]).decode().rstrip('\0').split('\0')
          dictionary = b''.join(subprocess.check_output(['git', 'show', base + ':' + name])
              for name in sorted(names) if '.integration' not in PurePosixPath(name).parts
              and PurePosixPath(name).name != 'recover-verified-source.yml')
          checked(dictionary, '12be27015f27bc1b921bbb0f8a5343392eb7e69988bd61fe00d8c3a064157460')
          Path('/tmp/ninlil-source.dictionary').write_bytes(dictionary)
          encoded = ''.join(Path('.transfer/verified-%02d.b64' % i).read_text().strip() for i in range(11))
          if len(encoded) != 102968:
              raise SystemExit('Unexpected transfer length')
          packed = checked(base64.b64decode(encoded, validate=True),
              '70133e020bb051d7ca185d901910972b09b579e2dc656b159c63a9425c38e752')
          Path('/tmp/ninlil-source.zst').write_bytes(packed)
          recipe = checked(subprocess.check_output(['zstd', '-q', '-d', '-c', '-D',
              '/tmp/ninlil-source.dictionary', '/tmp/ninlil-source.zst']),
              'b8a62ecade0ea78c2c282d4bcbdc9e4641f586838355c3cfeb225d6d91fcf9f6')
          entries = json.loads(recipe)
          if len(entries) != 128:
              raise SystemExit('Unexpected source-change count')
          outputs, seen = [], set()
          for name, old_hash, new_hash, edits in entries:
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '.git' in p.parts or name in seen:
                  raise SystemExit('Unsafe or duplicated source path')
              seen.add(name)
              path = Path(name)
              if path.is_symlink() or any(parent.is_symlink() for parent in path.parents):
                  raise SystemExit('Symlink in source path')
              old = checked(path.read_bytes() if path.is_file() else b'', old_hash)
              lines = old.decode().splitlines(keepends=True)
              previous = 0
              for start, end, replacement in edits:
                  if type(start) is not int or type(end) is not int or not isinstance(replacement, str) or not previous <= start <= end <= len(lines):
                      raise SystemExit('Invalid edit bounds')
                  previous = end
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              outputs.append((path, checked(''.join(lines).encode(), new_hash)))
          for path, data in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for name in ('scripts/check_esp_syntax.sh', 'scripts/loc_p0.sh', 'scripts/static_analysis.sh'):
              Path(name).chmod(0o755)
          subprocess.run(['git', 'add', '--'] + sorted(seen), check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('All 128 source changes verified against checkpoint afe1f99040eaceb55e25a95b194fbb19d1c23b06')
          PY
      - name: Build actual SDK and run all native tests before publication
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch_edhoc.sh
          bash scripts/fetch_sx126x_driver.sh
          python3 scripts/check_edhoc.py
          bash scripts/check_sx126x_driver.sh
          cmake -S . -B build-recovered -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-recovered --parallel 2
          ctest --test-dir build-recovered --output-on-failure --output-junit "$RUNNER_TEMP/recovered-tests.xml"
      - name: Publish verified ordinary sources without transfer debris
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .transfer .integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate verified durable Core, route feedback and bounded delivery service'
          git push origin HEAD:implementation/validated-integration-20260910
      - name: Capture source and test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/recovered-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/recovered-evidence/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/recovered-evidence/tree.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/recovered-evidence/uncommitted.patch"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/recovered-evidence/source.tar.gz"
          if test -f "$RUNNER_TEMP/recovered-tests.xml"; then cp "$RUNNER_TEMP/recovered-tests.xml" "$RUNNER_TEMP/recovered-evidence/"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovered-integration-source
          path: ${{ runner.temp }}/recovered-evidence/
          if-no-files-found: error
          retention-days: 7
