name: Recover verified source
on:
  push:
    branches: [implementation/validated-integration-20260910]
    paths: [.github/workflows/recover-verified-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ninlil-recover-verified-source
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and restore exact previously reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = implementation/validated-integration-20260910
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, bz2, lzma, zlib, hashlib
          parts = [Path('.integration') / ('part%02d.b64' % i) for i in range(5)]
          raw = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          expected = '4aead738e042573213dbdfb63b568d638107f71ff8a5ea94684678286f7d5e95'
          candidates = [raw]
          for decode in (gzip.decompress, bz2.decompress, lzma.decompress, zlib.decompress):
              try:
                  candidates.append(decode(raw))
              except Exception:
                  pass
          matches = [p for p in candidates if hashlib.sha256(p).hexdigest() == expected]
          if len(matches) != 1 or len(matches[0]) != 547831:
              raise SystemExit('Transfer does not match the reviewed patch; refusing to apply')
          Path('/tmp/ninlil-verified.patch').write_bytes(matches[0])
          print('Verified patch SHA-256:', expected)
          PY
          git apply --check /tmp/ninlil-verified.patch
          git apply --index /tmp/ninlil-verified.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: restore verified identity-bound Core, fanout, and route integration'
          git push origin HEAD:implementation/validated-integration-20260910
      - name: Build complete source with pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          bash scripts/fetch_edhoc.sh
          bash scripts/fetch_sx126x_driver.sh
          python3 scripts/check_edhoc.py
          bash scripts/check_sx126x_driver.sh
          cmake -S . -B build-recovered -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-recovered --parallel 2
          ctest --test-dir build-recovered --output-on-failure --output-junit "$RUNNER_TEMP/recovered-tests.xml"
      - name: Capture immutable source identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/recovered-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/recovered-evidence/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/recovered-evidence/tree.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/recovered-evidence/source.tar.gz"
          if test -f "$RUNNER_TEMP/recovered-tests.xml"; then cp "$RUNNER_TEMP/recovered-tests.xml" "$RUNNER_TEMP/recovered-evidence/"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovered-integration-source
          path: ${{ runner.temp }}/recovered-evidence/
          if-no-files-found: error
          retention-days: 7
