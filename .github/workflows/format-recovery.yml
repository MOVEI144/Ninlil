name: Normalize recovered C sources

on:
  push:
    branches:
      - recovery/restore-canonical-source
    paths:
      - ".github/workflows/format-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ninlil-recovery-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Normalize first-party C sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "recovery/restore-canonical-source"
          clang-format --version
          mapfile -d '' files < <(
            find include src ports tests embedded \
              -type f \( -name '*.c' -o -name '*.h' \) \
              ! -path 'third_party/*' -print0 | sort -z
          )
          test "${#files[@]}" -gt 0
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          rm .github/workflows/format-recovery.yml
          git diff --check

      - name: Commit formatting normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize recovered C sources"
          git push origin HEAD:recovery/restore-canonical-source
