name: Bootstrap canonical source import

on:
  push:
    paths:
      - .github/workflows/bootstrap-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ninlil-bootstrap-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Probe branch write
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C feature/import-m3-security-state
          printf '%s\n' "bootstrap probe ${GITHUB_SHA}" > .bootstrap-action-probe
          git add .bootstrap-action-probe
          git commit -m "ci: verify bootstrap branch write"
          git push --force origin HEAD:feature/import-m3-security-state