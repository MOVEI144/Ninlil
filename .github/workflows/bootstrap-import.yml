name: Bootstrap canonical source import

on:
  push:
    paths:
      - .github/workflows/bootstrap-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ninlil-bootstrap-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify and materialize review branch
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          exec > >(tee /tmp/ninlil-bootstrap.log) 2>&1

          record_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              set +e
              git switch -C feature/import-m3-security-state
              cp /tmp/ninlil-bootstrap.log .bootstrap-failure.log
              git add .bootstrap-failure.log
              git commit -m "ci: record canonical import failure"
              git push --force origin HEAD:feature/import-m3-security-state
            fi
            exit "$rc"
          }
          trap record_failure EXIT
          set -e

          cat > /tmp/bootstrap-parts.sha256 <<'SUMS'
          ab4678d88affe5d7396c39a8a10207e8a3e3d4d904c1da0184d599edcaf88056  .bootstrap/source.part-00
          b44eaf3f3b2c2f9bb6426f99bfd269350d58b72a8785af5943b8309bbc447b1a  .bootstrap/source.part-01
          1aaf99f9a72ebabf7cf33884fb7e2e163881b83dd717fc36949bfb62e2c5a8de  .bootstrap/source.part-02
          079675c921ad3d61a3767edc953ed074e810d0cb8faf7bed610837f180605618  .bootstrap/source.part-03
          11902ed07be1abca44f0861513ac543a04d00239c21b55c7853ceb722eb29d1c  .bootstrap/source.part-04
          48e35881913c98d16a396dbdecdf2e451dfd393d056d7a203123b4807c57c559  .bootstrap/source.part-05
          4fd0d22a4ec5829a5f1d0c9fe455cb991306e5eab5f6bc96640f8284cce12931  .bootstrap/source.part-06
          72919e129a15eeab673129e0b68206b85e3bedda47fe6db59d378b8880c188b6  .bootstrap/source.part-07
          073df3e6e78d16ee77ca09dabcf9902b92b6bc10ec448f7d1a23edd0284e4490  .bootstrap/source.part-08
          0687aee02d07850b336b28d8349f6d65069c62542116b8ba7567fb915bb04751  .bootstrap/source.part-09a
          7a6db13ccb9488f38227394a9c588829360a7edbbac5054af9b8ac7047b489bb  .bootstrap/source.part-09b
          ef74786c74e05bf6eb616b69311137ec83f598546978ea63adf7e0d46f885062  .bootstrap/source.part-09c
          58192a6ae53713cda1eec1a8eff5cab58b8f17f24031009821312a7857946b24  .bootstrap/source.part-09d
          70ef211ce5692ebd9216f7dcdf14b7fedca9d40f5dcf93a4725ebd70955a9531  .bootstrap/source.part-10
          54f21afa1f62ba6ee8dc4b3aa37eda3cde6e87a9756c2074d91b833b5945a123  .bootstrap/source.part-11
          SUMS
          sha256sum --check --strict /tmp/bootstrap-parts.sha256
          cat \
            .bootstrap/source.part-{00..08} \
            .bootstrap/source.part-09a \
            .bootstrap/source.part-09b \
            .bootstrap/source.part-09c \
            .bootstrap/source.part-09d \
            .bootstrap/source.part-10 \
            .bootstrap/source.part-11 \
            > /tmp/ninlil-source.tar.xz.b64
          base64 --decode /tmp/ninlil-source.tar.xz.b64 > /tmp/ninlil-source.tar.xz
          echo "a9b5a8c5647c33e553b22f5aed4742ea07836ec22e023b66f53eb851d57a496b  /tmp/ninlil-source.tar.xz" | sha256sum --check --strict
          test "$(wc -c < /tmp/ninlil-source.tar.xz)" -eq 62416
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/ninlil-source.tar.xz"
          with tarfile.open(archive, "r:xz") as tf:
              members = tf.getmembers()
              if len(members) != 107:
                  raise SystemExit(f"unexpected archive member count: {len(members)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are not permitted: {member.name}")
          PY

          cp .github/workflows/ci.yml /tmp/ninlil-ci.yml
          git switch -C feature/import-m3-security-state
          tar -xJf /tmp/ninlil-source.tar.xz
          cp /tmp/ninlil-ci.yml .github/workflows/ci.yml
          rm -f .bootstrap-action-probe .bootstrap-failure.log
          test -f CMakeLists.txt
          test -x scripts/ci.sh
          test -f include/ninlil.h
          test -f ports/esp32s3/ninlil_sx1262_radio.c
          test -f ports/flash/ninlil_security_state.c
          test -f tests/test_security_state.c
          git add -A
          git diff --cached --check
          git commit -m "feat: import reviewed radio and security-state baseline"
          git push --force origin HEAD:feature/import-m3-security-state