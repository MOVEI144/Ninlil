name: Recover canonical source

on:
  push:
    branches:
      - recovery/restore-canonical-source
    paths:
      - ".github/workflows/recover-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ninlil-canonical-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "recovery/restore-canonical-source"

          cat > /tmp/source-parts.sha256 <<'SUMS'
          39c8a1e9d6434a912dc7f95f162850de54b76ac8ada74b28c1631c4563daa6fe  .recovery/source.part-00
          edbc22e6de7d5cb9b1eb30d36fa5dd1efd679a03c520619e081ee0774272cd8f  .recovery/source.part-01
          69e0c9d441e9f08767961d5d0f2b493aeade57c6beb69d36cebe5425012c0aa6  .recovery/source.part-02
          5d7341964957c4a7166d704036bdf989c7d82e44fb3f6dd6ee442ab12156475c  .recovery/source.part-03
          473799ec859aa07be512659729b3d3e907d406b0392605d0ca7b8c8569c28cb5  .recovery/source.part-04
          c406a12d5376cb5d8213df8454e2bc10076748d694a5a105d161310d7ac2903c  .recovery/source.part-05
          0934d6c0ce1f5a05b2b94226c770c395b5238fb8ca89d22f2b9db2f3a2c855e3  .recovery/source.part-06
          aded5677d8b9bacd7e1dff75c4d4c17abafca0865b4c8933e8eaccafe6895de4  .recovery/source.part-07
          5e779a4d3e2836136bd2ce48da29a4ad07ce49095ab63f8d646ed8591e4af11b  .recovery/source.part-08
          24b781f8599a75b230d4c329e08d069a9864ef28ed9f341d7dcfb092e2a9b3e0  .recovery/source.part-09
          bbac613bd8dbb3310734974e0326697e7ec4d8155bbe3a78579c6efdbc15f50e  .recovery/source.part-10
          SUMS
          sha256sum --check --strict /tmp/source-parts.sha256

          cat .recovery/source.part-{00..10} > /tmp/ninlil-source.tar.gz.b64
          echo "004079fc551040cd8bf91138d7b09c74e6c9dc966511e2bad9ad3e3a65f2eda5  /tmp/ninlil-source.tar.gz.b64" | sha256sum --check --strict
          test "$(wc -c < /tmp/ninlil-source.tar.gz.b64)" -eq 84636

          base64 --decode /tmp/ninlil-source.tar.gz.b64 > /tmp/ninlil-source.tar.gz
          echo "b975b1ad9b72355635fa9396d00bf0e00fbbd5c596ddb2aa4e25e2f70c6b16f9  /tmp/ninlil-source.tar.gz" | sha256sum --check --strict
          test "$(wc -c < /tmp/ninlil-source.tar.gz)" -eq 63477

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/ninlil-source.tar.gz"
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) != 104:
                  raise SystemExit(f"unexpected archive member count: {len(members)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or path.parts[0] != "Ninlil-M3.3"
                  ):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name}")
          PY

      - name: Restore source and remove bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail

          rm -rf embedded include ports scripts src tests third_party
          rm -f CMakeLists.txt .clang-format .gitignore
          tar --extract --gzip --file /tmp/ninlil-source.tar.gz \
            --strip-components=1 --no-same-owner

          rm -rf .bootstrap .recovery
          rm -f .bootstrap-failure.log
          rm -f \
            .github/workflows/bootstrap-import-v2.yml \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/canonical-import-gate.yml \
            .github/workflows/cleanup-import-v2.yml \
            .github/workflows/cleanup-import.yml \
            .github/workflows/finalize-import.yml \
            .github/workflows/format-import.yml \
            .github/workflows/recover-source.yml

          cat > docs/RECOVERY_2026-08-26.md <<'EOF'
          # Canonical source recovery — 2026-08-26

          The canonical repository previously claimed a reviewed source import, but
          its `main` tree contained only documentation and failed bootstrap payloads.
          The implementation directories were absent.

          This recovery restores the reviewed M3.3 software candidate from the
          independently retained Git bundle and verifies its reconstructed archive
          before extraction.

          - Source commit: `b10c92dbb267e416c388889eff72aa4adc2ff30c`
          - Source tree: `fa2003c3bbccfa6c790116d0aa65e9fc6470079a`
          - Archive SHA-256: `b975b1ad9b72355635fa9396d00bf0e00fbbd5c596ddb2aa4e25e2f70c6b16f9`
          - Archive size: 63,477 bytes
          - Archive members: 104

          Before upload, the exact source was re-run locally through GCC, Clang,
          both sanitizer configurations, ESP32 first-party syntax checks, and static
          analysis. The pull request CI remains the remote acceptance gate for the
          recovered Git tree.

          This is a software-source recovery only. It does not claim two-board RF,
          hard-power flash interruption, production security, EDHOC/Join, Relay, or
          field acceptance.
          EOF

          chmod +x scripts/*.sh
          test -f CMakeLists.txt
          test -x scripts/ci.sh
          test -f include/ninlil.h
          test -f src/ninlil.c
          test -f ports/esp32s3/ninlil_sx1262_radio.c
          test -f ports/flash/ninlil_security_state.c
          test -f tests/test_security_state.c
          test -f docs/M3_3_SECURITY_STATE.md
          test -f docs/RECOVERY_2026-08-26.md
          test ! -e .bootstrap
          test ! -e .bootstrap-failure.log
          test ! -e .recovery
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/ci.yml
          git diff --check

      - name: Commit recovered source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore canonical Ninlil source tree"
          git push origin HEAD:recovery/restore-canonical-source
