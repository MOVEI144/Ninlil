name: Canonical import merge gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ninlil-canonical-import-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feature/import-m3-security-state'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact successful head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify canonical import boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -x scripts/ci.sh
          test -f include/ninlil.h
          test -f ports/esp32s3/ninlil_sx1262_radio.c
          test -f ports/flash/ninlil_security_state.c
          test -f tests/test_security_state.c
          test ! -e .bootstrap
          test ! -e .bootstrap-failure.log
          test ! -e .bootstrap-action-probe
          test ! -e .github/workflows/bootstrap-import.yml
          test ! -e .github/workflows/bootstrap-import-v2.yml
          git diff --check origin/main...HEAD
      - name: Require PR 1 exact head and mergeability
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(gh api repos/MOVEI144/Ninlil/pulls/1 --jq .head.sha)"
          state="$(gh api repos/MOVEI144/Ninlil/pulls/1 --jq .state)"
          test "$actual_head" = "$EXPECTED_HEAD"
          test "$state" = "open"
      - name: Mark ready and merge exact CI head
        shell: bash
        run: |
          set -euo pipefail
          node_id="$(gh api repos/MOVEI144/Ninlil/pulls/1 --jq .node_id)"
          is_draft="$(gh api repos/MOVEI144/Ninlil/pulls/1 --jq .draft)"
          if [ "$is_draft" = "true" ]; then
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
              -f id="$node_id" >/dev/null
          fi
          gh api --method PUT repos/MOVEI144/Ninlil/pulls/1/merge \
            -f merge_method=merge \
            -f sha="$EXPECTED_HEAD" \
            -f commit_title='Import reviewed C11 radio and persistent security-state baseline' \
            -f commit_message='Canonical software-candidate import. Physical RF and hard-power acceptance remain explicitly not run.' \
            --jq 'select(.merged == true) | .sha'
      - name: Enable main CI and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = 'on:\n  pull_request:\n  workflow_dispatch:\n'
          new = 'on:\n  pull_request:\n  push:\n    branches: [main]\n  workflow_dispatch:\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'push:\n    branches: [main]' not in text:
              raise SystemExit('unexpected CI trigger block')
          path.write_text(text)
          PY
          git rm -f --ignore-unmatch \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-import-v2.yml \
            .github/workflows/cleanup-import.yml \
            .github/workflows/cleanup-import-v2.yml \
            .github/workflows/format-import.yml \
            .github/workflows/finalize-import.yml \
            .github/workflows/canonical-import-gate.yml
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci: enable canonical main branch gates"
          git push origin main