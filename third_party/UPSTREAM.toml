[[dependency]]
name = "zcbor"
repository = "https://github.com/NordicSemiconductor/zcbor.git"
commit = "d3093b5684f62268c7f27f8a5079f166772619de"
license = "Apache-2.0"
usage = "Pinned libedhoc CBOR backend, zero-length-copy compatibility patch"

[[dependency]]
